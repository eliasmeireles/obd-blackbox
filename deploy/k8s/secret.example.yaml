apiVersion: v1
kind: Secret
metadata:
  name: obd-blackbox
  namespace: obd-blackbox
type: Opaque
stringData:
  DATABASE_URL: postgres://obd_blackbox:replace-with-random-password@postgres:5432/obd_blackbox?sslmode=disable
  API_KEYS: phone:replace-with-a-random-key-at-least-32-characters
  COOKIE_SECRET: replace-with-a-random-secret-at-least-32-bytes
  POSTGRES_DB: obd_blackbox
  POSTGRES_USER: obd_blackbox
  POSTGRES_PASSWORD: replace-with-random-password
