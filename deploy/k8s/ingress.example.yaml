apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obd-blackbox
  namespace: obd-blackbox
spec:
  tls:
    - hosts: [obd.example.com]
      secretName: obd-blackbox-tls
  rules:
    - host: obd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: obd-blackbox
                port:
                  name: http
